; Бизнес-настройки совместных покупок.
; Файл читается при старте приложения (путь задаётся через BUSINESS_SETTINGS_FILE).
; Здесь НЕТ секретов — только параметры расчётов, их можно держать в git.

[business]
; Ориентировочная фиксированная таможенная сумма на одну посылку, EUR
customs_flat_fee_eur = 3

; Максимальная общая стоимость товаров в одной закупке, EUR
purchase_limit_eur = 150

[limits]
; Максимальное количество единиц товара в одной заявке участника
max_items_per_participant = 100

; Максимальный срок сбора от текущего момента, дней
max_deadline_days = 365

[group]
; Через сколько секунд удалять служебную переписку в группе
; (команды и ответы бота). 0 — не удалять.
group_cleanup_seconds = 90
